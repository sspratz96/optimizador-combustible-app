name: Actualizar precios CNE

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login y obtener token
        run: |
          CODE=$(curl -s -o resp.json -w '%{http_code}' -X POST "https://api.cne.cl/api/login" \
            --data-urlencode "email=${{ secrets.CNE_EMAIL }}" \
            --data-urlencode "password=${{ secrets.CNE_PASSWORD }}")
          if [ "$CODE" != "200" ]; then
            echo "ERROR: login CNE devolvió HTTP $CODE"
            head -c 300 resp.json; echo
            exit 1
          fi
          TOKEN=$(python3 -c "import json; print(json.load(open('resp.json'))['token'])")
          if [ -z "$TOKEN" ]; then
            echo "ERROR: login OK pero token vacío"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "CNE_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Descargar estaciones
        run: |
          CODE=$(curl -s --compressed -o raw_stations.json -w '%{http_code}' \
            "https://api.cne.cl/api/v4/estaciones" \
            -H "Authorization: Bearer $CNE_TOKEN")
          if [ "$CODE" != "200" ]; then
            echo "ERROR: descarga devolvió HTTP $CODE"
            head -c 300 raw_stations.json; echo
            exit 1
          fi
          python3 << 'PYEOF'
          import json, sys
          d = json.load(open('raw_stations.json'))
          if not isinstance(d, list) or len(d) == 0:
              print(f"ERROR: se esperaba una lista de estaciones, llegó {type(d).__name__}")
              print(open('raw_stations.json').read()[:300])
              sys.exit(1)
          print(f"{len(d)} estaciones descargadas (todo Chile)")
          PYEOF

      - name: Transformar a formato app (solo RM)
        run: |
          python3 << 'PYEOF'
          import json
          import os

          with open('raw_stations.json') as f:
              raw = json.load(f)

          stations = []
          for item in raw:
              ub = item.get('ubicacion', {})
              # Solo Región Metropolitana (el código puede llegar como str o int)
              if str(ub.get('codigo_region')) != '13':
                  continue
              if item.get('en_mantenimiento') == 1:
                  continue

              lat = ub.get('latitud')
              lng = ub.get('longitud')
              if not lat or not lng:
                  continue

              brand_raw = item.get('distribuidor', {}).get('marca', '')
              # Normalizar marca
              brand_map = {
                  'COPEC': 'Copec', 'SHELL': 'Shell',
                  'ARAMCO': 'Aramco', 'PETROBRAS': 'Petrobras',
                  'TERPEL': 'Terpel',
              }
              brand = brand_map.get(brand_raw.upper(), brand_raw.title())

              precios = item.get('precios', {})
              prices = {}
              fuel_map = {'93': '93', '95': '95', '97': '97', 'DI': 'diesel'}
              for api_key, app_key in fuel_map.items():
                  if api_key in precios:
                      try:
                          p = float(precios[api_key]['precio'])
                          prices[app_key] = round(p)
                      except (ValueError, KeyError):
                          pass

              if not prices:
                  continue

              stations.append({
                  'id': item.get('codigo', ''),
                  'name': f"{brand} {ub.get('direccion', '')}".strip(),
                  'brand': brand,
                  'address': ub.get('direccion', ''),
                  'comuna': ub.get('nombre_comuna', ''),
                  'lat': float(lat),
                  'lng': float(lng),
                  'prices': prices,
              })

          os.makedirs('data', exist_ok=True)
          with open('data/stations.json', 'w') as f:
              json.dump(stations, f, ensure_ascii=False)

          print(f"✅ {len(stations)} estaciones RM procesadas")
          PYEOF

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stations.json
          git diff --cached --quiet || git commit -m "🔄 Precios $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
