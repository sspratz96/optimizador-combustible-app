<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BencinApp — Encuentra la bencina más barata en Santiago</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #242836;
  --border: #2e3344;
  --text: #e4e6ed;
  --text2: #8b8fa4;
  --accent: #3b82f6;
  --accent2: #60a5fa;
  --copec: #e63946;
  --shell: #f5b731;
  --aramco: #22a867;
  --success: #22c55e;
  --warn: #f59e0b;
  --radius: 10px;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; overflow:hidden; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
}

/* ─── HEADER ─── */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  z-index: 1000;
  flex-shrink: 0;
}
.header h1 {
  font-size: 18px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}
.header h1 span { font-size: 22px; }
.day-badge {
  font-size: 12px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 20px;
  background: var(--accent);
  color: #fff;
}
.btn-config {
  width: 38px; height: 38px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text);
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ─── FUEL TABS ─── */
.fuel-tabs {
  display: flex;
  gap: 6px;
  padding: 8px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  overflow-x: auto;
}
.fuel-tab {
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text2);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  font-family: var(--font);
}
.fuel-tab.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

/* ─── MAP ─── */
.map-wrap {
  flex: 1;
  position: relative;
  min-height: 0;
}
#map { width: 100%; height: 100%; }
.leaflet-tile-pane { filter: brightness(0.75) contrast(1.1) saturate(0.3); }
.station-marker {
  width: 32px; height: 32px;
  border-radius: 50%;
  border: 3px solid #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  cursor: pointer;
}
.marker-copec { background: var(--copec); }
.marker-shell { background: var(--shell); color: #333; }
.marker-aramco { background: var(--aramco); }
.marker-best {
  border-color: var(--success) !important;
  box-shadow: 0 0 0 3px rgba(34,197,94,0.3), 0 2px 8px rgba(0,0,0,0.4) !important;
  transform: scale(1.15);
}
.leaflet-popup-content-wrapper {
  background: var(--surface) !important;
  color: var(--text) !important;
  border-radius: var(--radius) !important;
  border: 1px solid var(--border);
}
.leaflet-popup-tip { background: var(--surface) !important; }
.popup-inner { font-size: 13px; line-height: 1.5; min-width: 180px; }
.popup-inner .brand { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
.popup-inner .address { color: var(--text2); font-size: 12px; margin-bottom: 6px; }
.popup-inner .price-row { display: flex; justify-content: space-between; align-items: center; }
.popup-inner .effective { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700; color: var(--success); }
.popup-inner .discount-tag {
  font-size: 11px;
  padding: 2px 6px;
  border-radius: 4px;
  background: rgba(34,197,94,0.15);
  color: var(--success);
  font-weight: 600;
}

/* ─── LOADING ─── */
.loading-overlay {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  gap: 16px;
}
.loading-overlay .spinner {
  width: 40px; height: 40px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-overlay p { color: var(--text2); font-size: 14px; }

/* ─── BOTTOM PANEL ─── */
.panel {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--surface);
  border-radius: 16px 16px 0 0;
  z-index: 800;
  max-height: 55vh;
  display: flex;
  flex-direction: column;
  box-shadow: 0 -4px 24px rgba(0,0,0,0.4);
  transition: max-height 0.3s ease;
}
.panel.collapsed { max-height: 64px; }
.panel-handle {
  width: 36px; height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 10px auto 6px;
  cursor: pointer;
  flex-shrink: 0;
}
.panel-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 16px 10px;
  flex-shrink: 0;
}
.panel-header h2 { font-size: 15px; font-weight: 600; }
.panel-header .count { color: var(--text2); font-size: 13px; }
.results-list {
  overflow-y: auto;
  padding: 0 12px 16px;
  flex: 1;
}
.result-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  margin-bottom: 8px;
  background: var(--surface2);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  cursor: pointer;
  transition: border-color 0.2s;
}
.result-card:hover, .result-card.highlight { border-color: var(--accent); }
.result-card.best { border-color: var(--success); background: rgba(34,197,94,0.06); }
.result-rank {
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  font-weight: 700;
  color: var(--text2);
  min-width: 24px;
  text-align: center;
}
.result-card.best .result-rank { color: var(--success); }
.result-brand-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}
.result-info { flex: 1; min-width: 0; }
.result-name {
  font-weight: 600;
  font-size: 14px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.result-meta {
  color: var(--text2);
  font-size: 12px;
  display: flex;
  gap: 8px;
  margin-top: 2px;
}
.result-numbers { text-align: right; flex-shrink: 0; }
.result-total {
  font-family: 'JetBrains Mono', monospace;
  font-size: 16px;
  font-weight: 700;
}
.result-card.best .result-total { color: var(--success); }
.result-effective {
  font-size: 11px;
  color: var(--text2);
}
.result-discount {
  font-size: 11px;
  color: var(--success);
  font-weight: 600;
}

/* ─── CONFIG MODAL ─── */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 2000;
  display: none;
  align-items: flex-end;
  justify-content: center;
}
.modal-backdrop.open { display: flex; }
.modal {
  background: var(--surface);
  border-radius: 16px 16px 0 0;
  width: 100%;
  max-width: 480px;
  max-height: 85vh;
  overflow-y: auto;
  padding: 20px;
}
.modal h3 {
  font-size: 17px;
  font-weight: 700;
  margin-bottom: 16px;
}
.modal label {
  display: block;
  font-size: 13px;
  color: var(--text2);
  margin-bottom: 6px;
  font-weight: 500;
}
.modal input[type="number"] {
  width: 100%;
  padding: 10px 12px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text);
  font-size: 15px;
  font-family: 'JetBrains Mono', monospace;
  margin-bottom: 16px;
  outline: none;
}
.modal input[type="number"]:focus { border-color: var(--accent); }
.cards-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 16px;
}
.card-toggle {
  padding: 10px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text2);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  text-align: center;
  transition: all 0.2s;
  font-family: var(--font);
}
.card-toggle.active {
  border-color: var(--accent);
  background: rgba(59,130,246,0.1);
  color: var(--text);
}
.modal .btn-apply {
  width: 100%;
  padding: 14px;
  border-radius: var(--radius);
  border: none;
  background: var(--accent);
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  font-family: var(--font);
  margin-top: 8px;
}

/* ─── DESKTOP ─── */
@media (min-width: 768px) {
  .panel {
    position: absolute;
    top: 12px;
    right: 12px;
    bottom: 12px;
    left: auto;
    width: 380px;
    border-radius: var(--radius);
    max-height: none;
  }
  .panel.collapsed { max-height: none; }
  .panel-handle { display: none; }
  .modal-backdrop { align-items: center; }
  .modal { border-radius: var(--radius); max-width: 480px; }
}

/* ─── MISC ─── */
.empty-state {
  text-align: center;
  padding: 32px 16px;
  color: var(--text2);
  font-size: 14px;
  line-height: 1.6;
}
.today-deals {
  padding: 8px 16px;
  background: rgba(59,130,246,0.08);
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  color: var(--accent2);
  flex-shrink: 0;
  overflow-x: auto;
  white-space: nowrap;
}
.today-deals strong { font-weight: 600; }
.data-status {
  padding: 6px 16px;
  font-size: 12px;
  flex-shrink: 0;
  display: none;
  border-bottom: 1px solid var(--border);
}
.data-status.warn { display: block; background: rgba(245,158,11,0.12); color: var(--warn); font-weight: 600; }
.data-status.ok { display: block; background: var(--surface); color: var(--text2); }
</style>
</head>
<body>

<!-- Loading -->
<div class="loading-overlay" id="loading">
  <div class="spinner"></div>
  <p id="loadingText">Obteniendo tu ubicación…</p>
</div>

<!-- Header -->
<div class="header">

  <div style="display:flex;align-items:center;gap:10px;">
    <span class="day-badge" id="dayBadge"></span>
    <button class="btn-config" id="btnConfig" title="Configuración">⚙</button>

</div>

<!-- Data status bar -->
<div class="data-status" id="dataStatus"></div>

<!-- Today's deals bar -->
<div class="today-deals" id="todayDeals"></div>

    <div class="results-list" id="resultsList">

</div>

<!-- Config Modal -->
<div class="modal-backdrop" id="configModal">

    <label style="margin-bottom:10px;">Mis tarjetas</label>

    <button class="btn-apply" id="btnApply">Aplicar y recalcular</button>
  </div>
</div>

//  DATA

let DISCOUNTS = [];
let ALL_CARDS = [];
let discountsMeta = { validUntil: null, loaded: false };

async function loadDiscounts() {
  try {
    const resp = await fetch('discounts.json');
    if (!resp.ok) return;
    const data = await resp.json();
    if (!data || !Array.isArray(data.discounts)) return;
    DISCOUNTS = data.discounts.map(d => ({
      card: d.card,
      brand: d.brand,
      discount: d.discountPerLiter,
      days: d.days || [],
      app: d.app,
      maxMonthly: d.maxMonthly ?? null,
      notes: d.notes || '',
    }));
    ALL_CARDS = [...new Set(DISCOUNTS.map(d => d.card))].sort();
    discountsMeta = { validUntil: data.validUntil || null, loaded: true };
  } catch(e) { /* loaded queda en false; showDayInfo lo advierte */ }
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  STATE
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

let state = {
  userLat: null,
  userLng: null,
  fuel: '93',
  liters: 40,
  efficiency: 12,
  radius: 8,
  myCards: [],
  stations: [],
  ranked: [],
};

let map, userMarker, markers = [], popupOpen = false;

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  INIT
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

async function init() {
  try {
    setupUI();
    await loadDiscounts();
    showDayInfo();
    await getLocation();
    initMap();
    const loaded = await loadStations();
    state.stations = loaded.stations;
    showDataStatus(loaded);
    await recalculate();
    document.getElementById('loading').style.display = 'none';
  } catch (err) {
    console.error('Error de inicialización:', err);
    document.getElementById('loading').innerHTML = `
      <p style="font-size:32px;">⚠️</p>
      <p style="color:var(--text);font-weight:600;">La app no pudo iniciar</p>
      <p style="color:var(--text2);font-size:14px;">Puede ser un problema de red o un servicio externo caído.</p>
      <button onclick="location.reload()" style="padding:10px 24px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font);">Reintentar</button>
    `;
  }
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  LOCATION
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

function getLocation() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) {
      fallbackLocation();
      resolve();
      return;
    }
    navigator.geolocation.getCurrentPosition(
      pos => {
        state.userLat = pos.coords.latitude;
        state.userLng = pos.coords.longitude;
        resolve();
      },
      () => { fallbackLocation(); resolve(); },
      { enableHighAccuracy: true, timeout: 8000 }
    );
  });
}

function fallbackLocation() {
  // Default: Plaza Italia, Santiago
  state.userLat = -33.4372;
  state.userLng = -70.6345;
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  MAP
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

function initMap() {
  map = L.map('map', { zoomControl: false }).setView([state.userLat, state.userLng], 13);
  L.control.zoom({ position: 'topleft' }).addTo(map);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '© OpenStreetMap'
  }).addTo(map);

  userMarker = L.marker([state.userLat, state.userLng], {
    icon: L.divIcon({
      className: '',
      html: '<div style="width:16px;height:16px;background:var(--accent);border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 4px rgba(59,130,246,0.3);"></div>',
      iconSize: [16,16],
      iconAnchor: [8,8],
    })
  }).addTo(map);
}

function renderMarkers() {
  markers.forEach(m => map.removeLayer(m));
  markers = [];

  const bestId = state.ranked.length > 0 ? state.ranked[0].station.id : null;

  state.ranked.forEach((r, i) => {
    const s = r.station;
    const brandClass = `marker-${escapeHtml(s.brand.toLowerCase())}`;
    const isBest = s.id === bestId;
    const html = `<div class="station-marker ${brandClass} ${isBest ? 'marker-best' : ''}">${i+1}</div>`;

    const marker = L.marker([s.lat, s.lng], {
      icon: L.divIcon({ className:'', html, iconSize:[32,32], iconAnchor:[16,16] })
    }).addTo(map);

    marker.on('click', () => {
      const discountInfo = r.bestDiscount
        ? `<div class="discount-tag">-$${r.bestDiscount.discount}/L · ${escapeHtml(r.bestDiscount.card)}</div>`
        : '';
      marker.bindPopup(`
        <div class="popup-inner">
          <div class="brand">${escapeHtml(s.brand)} — ${escapeHtml(s.name.replace(s.brand+' ',''))}</div>
          <div class="address">${escapeHtml(s.address)}</div>
          <div style="margin:6px 0">${discountInfo}</div>
          <div class="price-row">
            <span style="color:var(--text2);font-size:12px;">Precio efectivo</span>
            <span class="effective">$${r.effectivePrice}/L</span>
          </div>
          <div style="margin-top:6px;font-size:12px;color:var(--text2);">
            ${r.estimated ? '~' : ''}${r.distanceKm.toFixed(1)} km · ${r.estimated ? '~' : ''}${r.durationMin} min · Traslado $${Math.round(r.travelCost).toLocaleString('es-CL')}
          </div>
          <div style="margin-top:6px;font-size:14px;font-weight:700;">
            Costo total: $${Math.round(r.totalCost).toLocaleString('es-CL')}
          </div>
        </div>
      `).openPopup();
    });

    markers.push(marker);
  });
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  LOAD STATIONS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

const STALE_HOURS = 24; // el pipeline corre cada 6 h; >24 h = 4 runs perdidos

async function loadStations() {
  try {
    const resp = await fetch('data/stations.json');
    if (resp.ok) {
      const stations = await resp.json();
      if (Array.isArray(stations) && stations.length > 0) {
        let updatedAt = null;
        try {
          const meta = await (await fetch('data/meta.json')).json();
          if (meta && meta.updatedAt) updatedAt = new Date(meta.updatedAt);
        } catch(e) { /* sin meta: antigüedad desconocida */ }
        return { stations, source: 'live', updatedAt };
      }
    }
  } catch(e) { /* fall through */ }
  return { stations: SAMPLE_STATIONS, source: 'sample', updatedAt: null };
}

function showDataStatus({ source, updatedAt }) {
  const el = document.getElementById('dataStatus');
  if (source === 'sample') {
    el.className = 'data-status warn';
    el.textContent = '⚠ Mostrando datos de EJEMPLO — los precios no son reales';
    return;
  }
  if (!updatedAt || isNaN(updatedAt.getTime())) {
    el.className = 'data-status ok';
    el.textContent = 'Precios: CNE (fuente oficial)';
    return;
  }
  const hours = (Date.now() - updatedAt.getTime()) / 3600000;
  if (hours > STALE_HOURS) {
    el.className = 'data-status warn';
    el.textContent = `⚠ Precios desactualizados — última actualización hace ${Math.round(hours)} h`;
  } else {
    el.className = 'data-status ok';
    el.textContent = `Precios CNE · actualizados hace ${hours < 1 ? 'menos de 1 h' : Math.round(hours) + ' h'}`;
  }
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  DISTANCE (Haversine + OSRM)
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

function haversine(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2-lat1)*Math.PI/180;
  const dLng = (lng2-lng1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

const routeCache = new Map(); // station.id → {distanceKm, durationMin, estimated:false}
// Supuesto: la ubicación del usuario se fija una vez en init(), por eso el caché
// no se invalida. Si algún día se agrega "re-ubicar", hay que hacer routeCache.clear().

async function fetchRoutes(stations) {
  const missing = stations.filter(s => !routeCache.has(s.id));

  if (missing.length > 0) {
    try {
      const coords = [
        `${state.userLng},${state.userLat}`,
        ...missing.map(s => `${s.lng},${s.lat}`)
      ].join(';');
      const url = `https://router.project-osrm.org/table/v1/driving/${coords}?sources=0&annotations=duration,distance`;

      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 8000);
      const resp = await fetch(url, { signal: ctrl.signal });
      clearTimeout(timer);

      const data = await resp.json();
      if (data.code === 'Ok' && Array.isArray(data.distances) && Array.isArray(data.durations)) {
        missing.forEach((s, i) => {
          const dist = data.distances[0][i + 1];
          const dur = data.durations[0][i + 1];
          if (dist != null && dur != null) {
            routeCache.set(s.id, {
              distanceKm: dist / 1000,
              durationMin: Math.round(dur / 60),
              estimated: false,
            });
          }
        });
      }
    } catch(e) { /* lo que falte sale estimado abajo, sin cachear */ }
  }

  return new Map(stations.map(s => {
    const cached = routeCache.get(s.id);
    if (cached) return [s.id, cached];
    const d = haversine(state.userLat, state.userLng, s.lat, s.lng) * 1.3;
    return [s.id, { distanceKm: d, durationMin: Math.round(d / 0.5), estimated: true }];
  }));
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  CALCULATE
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

function getDiscountsForStation(brand) {
  const today = new Date().getDay();
  return DISCOUNTS.filter(d =>
    d.brand === brand &&
    d.days.includes(today) &&
    state.myCards.includes(d.card)
  );
}

async function recalculate() {
  document.getElementById('loadingText').textContent = 'Calculando rutas…';
  document.getElementById('resultCount').textContent = 'recalculando…';

  // Filtro por radio (haversine rápido) y top 20 más cercanas
  const sorted = state.stations
    .map(s => ({ station: s, hav: haversine(state.userLat, state.userLng, s.lat, s.lng) }))
    .filter(x => x.hav <= state.radius)
    .sort((a,b) => a.hav - b.hav)
    .slice(0, 20);

  const routes = await fetchRoutes(sorted.map(x => x.station));

  const results = [];
  for (const { station: s } of sorted) {
    const price = s.prices[state.fuel];
    if (!price) continue;

    const discounts = getDiscountsForStation(s.brand);
    const bestDiscount = discounts.length > 0
      ? discounts.reduce((a, b) => a.discount > b.discount ? a : b)
      : null;
    const effectivePrice = price - (bestDiscount ? bestDiscount.discount : 0);

    const route = routes.get(s.id);

    // Costo de combustible ida y vuelta
    const roundTripKm = route.distanceKm * 2;
    const fuelForTrip = roundTripKm / state.efficiency;
    const travelCost = fuelForTrip * effectivePrice;

    const totalCost = (state.liters * effectivePrice) + travelCost;

    results.push({
      station: s,
      basePrice: price,
      bestDiscount,
      effectivePrice,
      distanceKm: route.distanceKm,
      durationMin: route.durationMin,
      estimated: route.estimated,
      travelCost,
      totalCost,
    });
  }

  results.sort((a, b) => a.totalCost - b.totalCost);
  state.ranked = results;

  renderMarkers();
  renderResults();
}

function escapeHtml(v) {
  return String(v).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  RENDER RESULTS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

function renderResults() {
  const list = document.getElementById('resultsList');
  const count = document.getElementById('resultCount');
  count.textContent = `${state.ranked.length} estaciones`;

  if (state.ranked.length === 0) {
    list.innerHTML = '<div class="empty-state">No hay estaciones en tu radio de búsqueda.<br>Prueba aumentándolo en ⚙ Configuración.</div>';
    return;
  }

  const bestTotal = state.ranked[0].totalCost;

  list.innerHTML = state.ranked.map((r, i) => {
    const s = r.station;
    const brandColor = s.brand === 'Copec' ? 'var(--copec)' : s.brand === 'Shell' ? 'var(--shell)' : 'var(--aramco)';
    const saving = Math.round(r.totalCost - bestTotal);
    const isBest = i === 0;
    const discountText = r.bestDiscount ? `-$${r.bestDiscount.discount}/L ${escapeHtml(r.bestDiscount.card)}` : '';

    return `
      <div class="result-card ${isBest ? 'best' : ''}" data-idx="${i}">
        <span class="result-rank">${i+1}</span>
        <span class="result-brand-dot" style="background:${brandColor}"></span>
        <div class="result-info">
          <div class="result-name">${escapeHtml(s.brand)} · ${escapeHtml(s.name.replace(s.brand+' ',''))}</div>
          <div class="result-meta">
            <span>${r.estimated ? '~' : ''}${r.distanceKm.toFixed(1)} km · ${r.durationMin} min</span>
          </div>
          ${discountText ? `<div class="result-discount">${discountText}</div>` : ''}
        </div>
        <div class="result-numbers">
          <div class="result-total">$${Math.round(r.totalCost).toLocaleString('es-CL')}</div>
          <div class="result-effective">$${r.effectivePrice}/L</div>
          ${!isBest && saving > 0 ? `<div style="font-size:11px;color:var(--warn);">+$${saving.toLocaleString('es-CL')}</div>` : ''}
        </div>
      </div>
    `;
  }).join('');

  // Click to fly to station
  list.querySelectorAll('.result-card').forEach(card => {
    card.addEventListener('click', () => {
      const idx = parseInt(card.dataset.idx);
      const r = state.ranked[idx];
      map.flyTo([r.station.lat, r.station.lng], 15, { duration: 0.8 });
      markers[idx]?.fire('click');
    });
  });
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  UI
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

function setupUI() {
  // Fuel tabs
  document.querySelectorAll('.fuel-tab').forEach(tab => {
    tab.addEventListener('click', async () => {
      document.querySelector('.fuel-tab.active')?.classList.remove('active');
      tab.classList.add('active');
      state.fuel = tab.dataset.fuel;
      await recalculate();
    });
  });

  // Panel collapse toggle
  const panel = document.getElementById('panel');
  document.getElementById('panelHandle').addEventListener('click', () => {
    panel.classList.toggle('collapsed');
  });

  // Config modal
  const modal = document.getElementById('configModal');
  document.getElementById('btnConfig').addEventListener('click', () => {
    renderCardsGrid();
    document.getElementById('inputLiters').value = state.liters;
    document.getElementById('inputEfficiency').value = state.efficiency;
    document.getElementById('inputRadius').value = state.radius;
    modal.classList.add('open');
  });
  modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('open'); });

  document.getElementById('btnApply').addEventListener('click', async () => {
    state.liters = parseFloat(document.getElementById('inputLiters').value) || 40;
    state.efficiency = parseFloat(document.getElementById('inputEfficiency').value) || 12;
    state.radius = parseFloat(document.getElementById('inputRadius').value) || 8;
    state.myCards = Array.from(document.querySelectorAll('.card-toggle.active')).map(el => el.dataset.card);
    modal.classList.remove('open');
    await recalculate();
  });
}

function renderCardsGrid() {
  const grid = document.getElementById('cardsGrid');
  grid.innerHTML = ALL_CARDS.map(card => {
    const active = state.myCards.includes(card) ? 'active' : '';
    return `<button class="card-toggle ${active}" data-card="${escapeHtml(card)}">${escapeHtml(card)}</button>`;
  }).join('');
  grid.querySelectorAll('.card-toggle').forEach(btn => {
    btn.addEventListener('click', () => btn.classList.toggle('active'));
  });
}

function showDayInfo() {
  const today = new Date().getDay();
  const dayName = DAYS_ES[today];
  document.getElementById('dayBadge').textContent = dayName;

  const dealsBar = document.getElementById('todayDeals');

  if (!discountsMeta.loaded) {
    dealsBar.innerHTML = '<strong>⚠ No se pudieron cargar los descuentos</strong> — precios sin descuento';
    return;
  }

  let expiredNote = '';
  if (discountsMeta.validUntil && new Date(discountsMeta.validUntil + 'T23:59:59') < new Date()) {
    expiredNote = ` · <strong>⚠ válidos hasta ${escapeHtml(discountsMeta.validUntil)}, pueden haber cambiado</strong>`;
  }

  const todayDiscounts = DISCOUNTS.filter(d => d.days.includes(today));
  if (todayDiscounts.length === 0) {
    dealsBar.innerHTML = `<strong>Hoy:</strong> Sin descuentos bancarios disponibles${expiredNote}`;
  } else {
    const deals = todayDiscounts.map(d => `<strong>${escapeHtml(d.brand)}</strong> -$${d.discount}/L con ${escapeHtml(d.card)}`).join(' · ');
    dealsBar.innerHTML = `<strong>Hoy ${dayName}:</strong> ${deals}${expiredNote}`;
  }
}
